<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="DDD-järjestys: kieli ensin, koodi viimeksi">
  <rect width="960" height="280" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">Tee tässä järjestyksessä</text>

  <rect x="24" y="70" width="140" height="120" rx="10" fill="#3d5a80"/>
  <text x="40" y="108" font-family="Segoe UI, Calibri, sans-serif" font-size="22" fill="#ffffff" font-weight="700">1</text>
  <text x="40" y="136" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff">Sanasto</text>
  <text x="40" y="158" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#a8dadc">paperille</text>

  <rect x="180" y="70" width="140" height="120" rx="10" fill="#3d5a80"/>
  <text x="196" y="108" font-family="Segoe UI, Calibri, sans-serif" font-size="22" fill="#ffffff" font-weight="700">2-3</text>
  <text x="196" y="136" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff">Invariantit</text>
  <text x="196" y="158" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#a8dadc">entiteetti / use case</text>

  <rect x="336" y="70" width="140" height="120" rx="10" fill="#457b9d"/>
  <text x="352" y="108" font-family="Segoe UI, Calibri, sans-serif" font-size="22" fill="#ffffff" font-weight="700">4-5</text>
  <text x="352" y="136" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff">Projektit</text>
  <text x="352" y="158" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#a8dadc">viittaukset</text>

  <rect x="492" y="70" width="140" height="120" rx="10" fill="#2a9d8f"/>
  <text x="508" y="108" font-family="Segoe UI, Calibri, sans-serif" font-size="22" fill="#ffffff" font-weight="700">6</text>
  <text x="508" y="136" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff">Domain</text>
  <text x="508" y="158" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#ffffff">+ domain-testit</text>

  <rect x="648" y="70" width="140" height="120" rx="10" fill="#2a9d8f"/>
  <text x="664" y="108" font-family="Segoe UI, Calibri, sans-serif" font-size="22" fill="#ffffff" font-weight="700">7</text>
  <text x="664" y="136" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff">Application</text>
  <text x="664" y="158" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#ffffff">use caset</text>

  <rect x="804" y="70" width="132" height="120" rx="10" fill="#1d3557"/>
  <text x="820" y="108" font-family="Segoe UI, Calibri, sans-serif" font-size="22" fill="#ffffff" font-weight="700">8-9</text>
  <text x="820" y="136" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#ffffff">Infra, API</text>
  <text x="820" y="158" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#a8dadc">testit, Swagger</text>

  <text x="24" y="230" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Älä hyppää Swaggeriin ennen vaihetta 6. Jos et tiedä mihin if kuuluu, palaa vaiheeseen 3.</text>
  <text x="24" y="256" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#457b9d">Sama järjestys kuin ohjatussa LeagueHubissa — nyt ilman valmista koodia.</text>
</svg>
