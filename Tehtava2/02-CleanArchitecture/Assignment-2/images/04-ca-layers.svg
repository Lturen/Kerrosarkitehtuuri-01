<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Clean Architecture: riippuvuudet osoittavat Domainiin">
  <rect width="960" height="560" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">Clean Architecture: Domain on keskellä</text>

  <defs>
    <marker id="caArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="80" y="64" width="800" height="78" rx="12" fill="#1d3557"/>
  <text x="108" y="96" font-family="Segoe UI, Calibri, sans-serif" font-size="18" fill="#ffffff" font-weight="700">API</text>
  <text x="108" y="120" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">Controllerit, requestit, Program.cs — composition root</text>

  <line x1="280" y1="142" x2="280" y2="168" stroke="#1d3557" stroke-width="2.5" marker-end="url(#caArrow)"/>
  <line x1="680" y1="142" x2="680" y2="168" stroke="#1d3557" stroke-width="2.5" marker-end="url(#caArrow)"/>

  <rect x="80" y="172" width="380" height="100" rx="12" fill="#457b9d"/>
  <text x="100" y="208" font-family="Segoe UI, Calibri, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Application</text>
  <text x="100" y="234" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">Use caset, Standing, NotFound</text>
  <text x="100" y="254" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">Orkestroi — ei invariantteja</text>

  <rect x="500" y="172" width="380" height="100" rx="12" fill="#2a9d8f"/>
  <text x="520" y="208" font-family="Segoe UI, Calibri, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Infrastructure</text>
  <text x="520" y="234" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">EF Core, DbContext, SQLite</text>
  <text x="520" y="254" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Repository-toteutukset</text>

  <line x1="270" y1="272" x2="400" y2="318" stroke="#1d3557" stroke-width="2.5" marker-end="url(#caArrow)"/>
  <line x1="690" y1="272" x2="560" y2="318" stroke="#1d3557" stroke-width="2.5" marker-end="url(#caArrow)"/>

  <rect x="200" y="322" width="560" height="110" rx="12" fill="#3d5a80"/>
  <text x="228" y="360" font-family="Segoe UI, Calibri, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Domain — ei viittaa mihinkään</text>
  <text x="228" y="386" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">Team, Match, Score, DomainException</text>
  <text x="228" y="408" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">ITeamRepository, IMatchRepository — rajapinnat, ei EF:ää</text>

  <text x="24" y="476" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Dependency Rule: nuolet osoittavat sisäänpäin. Tietokanta riippuu domainista — ei toisinpäin.</text>
  <text x="24" y="502" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#457b9d">API viittaa myös Infrastructureen, koska Program.cs kytkee rajapinnan toteutukseen.</text>
  <text x="24" y="528" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Sama jako kuin MyLeaguessa — tällä kurssilla ilman CQRS:ää ja Reactia.</text>
</svg>
