<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="MyLeague: neljä projektia, riippuvuudet sisäänpäin">
  <rect width="960" height="500" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" fill="#1d3557" font-weight="700">MyLeague: neljä projektia, riippuvuudet sisäänpäin</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d3557" flood-opacity="0.14"/>
    </filter>
    <pattern id="wallpaper" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#a8dadc"/>
      <circle cx="7" cy="7" r="2.2" fill="#2a9d8f" opacity="0.35"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e07a5f"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9b2226" stroke-width="2" opacity="0.25"/>
    </pattern>
  </defs>

  <rect x="80" y="64" width="800" height="78" rx="12" fill="#1d3557" filter="url(#shadow)"/><text x="108" y="96" font-family="Segoe UI, Calibri, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Presentation</text><text x="108" y="120" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">WebAPI + React  —  HTTP, controllerit, käyttöliittymä</text><line x1="480" y1="142" x2="480" y2="160" stroke="#1d3557" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="160" width="800" height="78" rx="12" fill="#457b9d" filter="url(#shadow)"/><text x="108" y="192" font-family="Segoe UI, Calibri, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Application</text><text x="108" y="216" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">CQRS + MediatR  —  Komennot, kyselyt, feature slicet</text><line x1="480" y1="238" x2="480" y2="256" stroke="#1d3557" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="256" width="800" height="78" rx="12" fill="#2a9d8f" filter="url(#shadow)"/><text x="108" y="288" font-family="Segoe UI, Calibri, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Infrastructure</text><text x="108" y="312" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">EF Core, Auth, SignalR  —  Tietokanta, identiteetti, reaaliaika</text><line x1="480" y1="334" x2="480" y2="352" stroke="#1d3557" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="352" width="800" height="78" rx="12" fill="#3d5a80" filter="url(#shadow)"/><text x="108" y="384" font-family="Segoe UI, Calibri, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Domain</text><text x="108" y="408" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">Entiteetit ja sopimukset  —  Säännöt. Ei HTTP:tä, ei SQL:ää.</text>
  <text x="24" y="472" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Nuoli = riippuvuus alaspäin. Domain ei tiedä WebAPI:sta eikä tietokannasta.</text>
</svg>
