<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Kaksi testitasoa: domain ja use case">
  <rect width="960" height="400" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">Kaksi testitasoa — ei HTTP:tä kummallakaan</text>

  <rect x="40" y="70" width="420" height="250" rx="10" fill="#e9f5f3" stroke="#2a9d8f" stroke-width="2"/>
  <text x="56" y="104" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#1d3557" font-weight="700">Domain-testi</text>
  <text x="56" y="136" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Ei fakea, ei repositorya.</text>
  <text x="56" y="160" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">new Match + RecordResult(now)</text>
  <text x="56" y="196" font-family="Segoe UI, Consolas, monospace" font-size="13" fill="#1d3557">Create_Throws_WhenSameTeam</text>
  <text x="56" y="220" font-family="Segoe UI, Consolas, monospace" font-size="13" fill="#1d3557">RecordResult_Throws_WhenAlready</text>
  <text x="56" y="256" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#2a9d8f">Aika parametrina — tuleva ottelu helppo.</text>

  <rect x="500" y="70" width="420" height="250" rx="10" fill="#e8f1f6" stroke="#457b9d" stroke-width="2"/>
  <text x="516" y="104" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#1d3557" font-weight="700">Use case -testi</text>
  <text x="516" y="136" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Fake toteuttaa ITeamRepositoryn.</text>
  <text x="516" y="160" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Testaa orkestrointia: puuttuva joukkue.</text>
  <text x="516" y="196" font-family="Segoe UI, Consolas, monospace" font-size="13" fill="#1d3557">ExecuteAsync_Throws_WhenTeamMissing</text>
  <text x="516" y="220" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Fake ei tiedä SQLitestä.</text>
  <text x="516" y="256" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#457b9d">Tallennus vaihtui — testit eivät.</text>

  <text x="40" y="356" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Kerralla 1 oli vain oikea laatikko (Service + fake). Vasen on uusi: entiteettiä voi testata yksin.</text>
</svg>
