<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="LeagueHub Clean Architecture -projektit">
  <rect width="960" height="520" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">Projektit ja viittaukset</text>

  <defs>
    <marker id="refArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="300" y="60" width="360" height="70" rx="10" fill="#1d3557"/>
  <text x="320" y="90" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">LeagueHub.Api</text>
  <text x="320" y="112" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#a8dadc">viittaa Application + Infrastructure</text>

  <line x1="380" y1="130" x2="220" y2="168" stroke="#1d3557" stroke-width="2" marker-end="url(#refArrow)"/>
  <line x1="580" y1="130" x2="740" y2="168" stroke="#1d3557" stroke-width="2" marker-end="url(#refArrow)"/>

  <rect x="40" y="172" width="360" height="80" rx="10" fill="#457b9d"/>
  <text x="60" y="204" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">LeagueHub.Application</text>
  <text x="60" y="228" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#a8dadc">viittaa vain Domainiin</text>

  <rect x="560" y="172" width="360" height="80" rx="10" fill="#2a9d8f"/>
  <text x="580" y="204" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">LeagueHub.Infrastructure</text>
  <text x="580" y="228" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#ffffff">viittaa vain Domainiin</text>

  <line x1="220" y1="252" x2="400" y2="300" stroke="#1d3557" stroke-width="2" marker-end="url(#refArrow)"/>
  <line x1="740" y1="252" x2="560" y2="300" stroke="#1d3557" stroke-width="2" marker-end="url(#refArrow)"/>

  <rect x="260" y="304" width="440" height="90" rx="10" fill="#3d5a80"/>
  <text x="280" y="340" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">LeagueHub.Domain</text>
  <text x="280" y="364" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">dotnet list LeagueHub.Domain reference — tyhjä lista</text>
  <text x="280" y="384" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#a8dadc">Tests viittaa Domain + Application</text>

  <text x="24" y="436" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Mitä ei lisätä: Domain ei viittaa kehenkään. Application ei viittaa Infrastructureen.</text>
  <text x="24" y="464" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#457b9d">Vanha LeagueHub-projekti jää viereen referenssiksi. Älä siirrä sen tiedostoja näihin.</text>
  <text x="24" y="492" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">LeagueHub.Tests ei näy kaaviossa ylhäällä — se ei ole kerros, se on tarkastaja.</text>
</svg>
