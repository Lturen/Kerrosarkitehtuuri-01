<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="Asiakkaan sanasta DDD-nimeksi">
  <rect width="960" height="580" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">Asiakkaan sanasta DDD-nimeksi</text>
  <defs>
    <marker id="ddArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="40" y="70" width="390" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="102" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">Joukkue, Pelaaja, Ottelu</text>
  <text x="60" y="128" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#457b9d">jokainen on oma yksilönsä</text>
  <line x1="430" y1="110" x2="526" y2="110" stroke="#1d3557" stroke-width="2.5" marker-end="url(#ddArrow)"/>
  <rect x="530" y="70" width="390" height="80" rx="10" fill="#3d5a80"/>
  <text x="550" y="102" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#ffffff" font-weight="700">Entiteetti — olio, jolla on Id</text>
  <text x="550" y="128" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">kaksi samannimistä ovat silti eri</text>

  <rect x="40" y="162" width="390" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="194" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">Tulos 2–1</text>
  <text x="60" y="220" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#457b9d">vain arvo merkitsee</text>
  <line x1="430" y1="202" x2="526" y2="202" stroke="#1d3557" stroke-width="2.5" marker-end="url(#ddArrow)"/>
  <rect x="530" y="162" width="390" height="80" rx="10" fill="#2a9d8f"/>
  <text x="550" y="194" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#ffffff" font-weight="700">Value object — ei Id:tä</text>
  <text x="550" y="220" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">2–1 on 2–1, ei ”tulos numero 7”</text>

  <rect x="40" y="254" width="390" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="286" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">”Tulos vain kerran”, ”nimi ei tyhjä”</text>
  <text x="60" y="312" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#457b9d">sääntö, joka ei saa rikkoutua</text>
  <line x1="430" y1="294" x2="526" y2="294" stroke="#1d3557" stroke-width="2.5" marker-end="url(#ddArrow)"/>
  <rect x="530" y="254" width="390" height="80" rx="10" fill="#457b9d"/>
  <text x="550" y="286" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#ffffff" font-weight="700">Invariantti</text>
  <text x="550" y="312" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">aina voimassa, kun olio on olemassa</text>

  <rect x="40" y="346" width="390" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="378" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">”Kirjaa tulos”, ”lisää pelaaja”</text>
  <text x="60" y="404" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#457b9d">tekeminen</text>
  <line x1="430" y1="386" x2="526" y2="386" stroke="#1d3557" stroke-width="2.5" marker-end="url(#ddArrow)"/>
  <rect x="530" y="346" width="390" height="80" rx="10" fill="#1d3557"/>
  <text x="550" y="378" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#ffffff" font-weight="700">Use case</text>
  <text x="550" y="404" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#a8dadc">hae oliot, kutsu domainia, tallenna</text>

  <rect x="40" y="438" width="390" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="470" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">Sarjataulukko</text>
  <text x="60" y="496" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#457b9d">lasketaan, ei kirjata mihinkään</text>
  <line x1="430" y1="478" x2="526" y2="478" stroke="#1d3557" stroke-width="2.5" marker-end="url(#ddArrow)"/>
  <rect x="530" y="438" width="390" height="80" rx="10" fill="#e9f5f3" stroke="#2a9d8f" stroke-width="2"/>
  <text x="550" y="470" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557" font-weight="700">Lukumalli</text>
  <text x="550" y="496" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">lasketaan entiteeteistä — ei ole entiteetti</text>

  <text x="24" y="556" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Sama sana asiakkaan puheessa ja koodissa: Joukkue → Team, Tulos → Score. Kieli ei käänny matkalla.</text>
</svg>
